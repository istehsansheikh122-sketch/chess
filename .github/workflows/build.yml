name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create --platforms=android --project-name chess_agent --org com.istehsaan .
      - name: Patch manifest and gradle (permissions, arm64-only, compressed libs)
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - name: Fix stockfish jcenter()
        run: |
          find "$HOME/.pub-cache" -path "*stockfish*" -name "*.gradle" 2>/dev/null | while read f; do
            sed -i 's/jcenter()/mavenCentral()/g' "$f" || true
          done
      - name: Build arm64 release APK (single, small)
        run: flutter build apk --release --target-platform android-arm64
      - name: Show APK size and biggest files
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk
          unzip -lv build/app/outputs/flutter-apk/app-release.apk | sort -k1 -n -r | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: chess-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
