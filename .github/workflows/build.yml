name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name chess_agent --org com.istehsaan .
      - name: Inject permissions + OverlayService + lint fix
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n    <application|' "$MANIFEST"
          python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          service = """
                  <service
                      android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating chess analysis button over other apps"/>
                  </service>
          """
          if "OverlayService" not in text:
              text = text.replace("</application>", service + "\n    </application>")
              p.write_text(text)
          print("Manifest updated OK")
          '
          # Disable release lint (fixes image_picker lintVital crash on CI)
          echo "" >> android/gradle.properties
          echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          # Also patch app build.gradle / .kts
          python3 -c '
          from pathlib import Path
          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              if "checkReleaseBuilds" in t:
                  print(name, "already has lint config")
                  continue
              if name.endswith(".kts"):
                  block = """
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
"""
              else:
                  block = """
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
"""
              # insert after first "android {"
              idx = t.find("android {")
              if idx >= 0:
                  # find end of that line
                  end = t.find("\n", idx)
                  t = t[:end+1] + block + t[end+1:]
                  p.write_text(t)
                  print("lint block added to", name)
              else:
                  print("android { not found in", name)
          '
          echo "lint fix applied"
          cat android/gradle.properties || true
      - run: flutter pub get
      - name: Fix stockfish jcenter() (Gradle 8+ removed it)
        run: |
          find "$HOME/.pub-cache" -path "*stockfish*" -name "*.gradle" 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i 's/jcenter()/mavenCentral()/g' "$f" || true
          done
          echo "stockfish gradle patch done"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chess-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
